server:
  port: 8096

auth:
  service:
    url: http://auth-service:8098

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8098
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1


        - id: patient-service
          uri: http://patient-service:8090
          predicates:
            - Path=/api/patient/**
          filters:
            - StripPrefix=1
            - JwtValidation

        - id: api-docs-patient-docs
          uri: http://patient-service:8090
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs

        - id: api-docs-auth-docs
          uri: http://auth-service:8098
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth,/v3/api-docs